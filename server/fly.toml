app = 'pondering-my-orb'
primary_region = 'fra'

[build]
dockerfile = "../Dockerfile"

[env]
GLEAM_ENV = "production"
BIND = "0.0.0.0"
PORT = "8080"

[http_service]
internal_port = 8080
force_https = true
auto_start_machines = true
min_machines_running = 0
processes = ['app']

[[vm]]
size = 'shared-cpu-1x'
memory = '256mb'

[[http_service.ports]]
port = 80
handlers = ["http"]

[[http_service.ports]]
port = 443
handlers = ["tls", "http"]
