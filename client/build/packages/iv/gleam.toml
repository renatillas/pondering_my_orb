name = "iv"
version = "1.4.0"

# Fill out these fields if you intend to generate HTML documentation or publish
# your project to the Hex package manager.
#
description = "A fast, safe, batteries-included array for Gleam!"
licences = ["BSD-3-Clause"]
repository = { type = "gitlab", user = "arkandos", repo = "iv" }
# links = [{ title = "Website", href = "" }]
#
# For a full reference of all the available options, you can have a look at
# https://gleam.run/writing-gleam/gleam-toml/.


[documentation]
pages = [
    { title = "Benchmarks", path = "benchmarks.html", source = "./benchmarks.md" },
]

[dependencies]
gleam_yielder = ">= 1.1.0 and < 2.0.0"
gleam_stdlib = ">= 0.53.0 and < 1.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
gleamy_bench = ">= 0.5.0 and < 1.0.0"
glearray = ">= 2.0.0 and < 3.0.0"
gary = ">= 1.1.0 and < 2.0.0"
